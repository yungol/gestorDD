<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A2236"/>
      <stop offset="100%" stop-color="#0D111A"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#56D4FF"/>
      <stop offset="55%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#56D4FF"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F87171"/>
    </linearGradient>
  </defs>

  <!-- Rounded Terminal Window Base -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#bg)" stroke="url(#ring)" stroke-width="4"/>

  <!-- Top Terminal Bar -->
  <path d="M12 32 C12 20 20 12 32 12 L96 12 C108 12 116 20 116 32 L116 36 L12 36 Z" fill="#232D45"/>
  <circle cx="28" cy="24" r="4.5" fill="#F87171"/>
  <circle cx="43" cy="24" r="4.5" fill="#FBBF24"/>
  <circle cx="58" cy="24" r="4.5" fill="#4ADE80"/>

  <!-- Disk Platter / Storage Ring -->
  <circle cx="46" cy="76" r="24" fill="#131926" stroke="#2D3A58" stroke-width="6"/>
  <circle cx="46" cy="76" r="24" fill="none" stroke="url(#ring)" stroke-width="6"
          stroke-dasharray="106 46" stroke-linecap="round" transform="rotate(-110 46 76)"/>
  <circle cx="46" cy="76" r="7" fill="#56D4FF"/>
  <circle cx="46" cy="76" r="3" fill="#0D111A"/>

  <!-- Terminal Prompt & Colored Usage Bars -->
  <path d="M80 54 L90 61 L80 68" fill="none" stroke="#56D4FF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="94" y="64" width="14" height="4.5" rx="2" fill="#4ADE80"/>

  <rect x="78" y="77" width="32" height="7" rx="3.5" fill="#232D45"/>
  <rect x="78" y="77" width="24" height="7" rx="3.5" fill="url(#bar1)"/>

  <rect x="78" y="89" width="32" height="7" rx="3.5" fill="#232D45"/>
  <rect x="78" y="89" width="18" height="7" rx="3.5" fill="url(#bar2)"/>
</svg>
